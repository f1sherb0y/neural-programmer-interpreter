[project]
name = "neural-programmer-interpreter"
version = "0.2.0"
description = "Modern PyTorch reproduction and graph extension of Neural Programmer-Interpreters"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.10,<3.11",
    "networkx>=3.6,<3.7",
    "numpy>=2.2",
    "torch>=2.11,<2.12",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
